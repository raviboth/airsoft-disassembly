// ---------- geometry helpers (x = along gun, muzzle +; y = up; z = right side) ----------
function prof(pts, depth, bevel = 1.2, holes = []) {
  const s = new THREE.Shape();
  pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));
  for (const h of holes) {
    const p = new THREE.Path();
    h.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y));
    s.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 });

function latheX(pts, seg = 36, y = 0, z = 0, phiStart = 0) {
  // one lathe strip per profile segment, merged: keeps corners crisp instead of smoothing normals across them

  for (let i = 0; i < pts.length - 1; i++) {
    const [r0, x0] = pts[i], [r1, x1] = pts[i + 1];
    if (r0 === r1 && x0 === x1) continue;
    strips.push(new THREE.LatheGeometry([new THREE.Vector2(r0, x0), new THREE.Vector2(r1, x1)], seg, phiStart));

  const g = strips.length === 1 ? strips[0] : mergeGeometries(strips);

// sweep along x through vertical sections: stations = [{ x, yt, yb, w }] (top, bottom, width). Superellipse sections, exponent n.
function crResample(levels, keys, key, step) {
  const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  const L = [];
  for (let k = 0; k < levels.length - 1; k++) {
    const a = levels[Math.max(0, k - 1)], b = levels[k], c = levels[k + 1], d = levels[Math.min(levels.length - 1, k + 2)];
    const steps = Math.max(1, Math.round(Math.abs(b[key] - c[key]) / step));
    for (let q = 0; q < steps; q++) { const t = q / steps, o = {}; for (const kk of keys) o[kk] = cr(a[kk], b[kk], c[kk], d[kk], t); L.push(o); }
  }
  L.push(levels[levels.length - 1]);
  return L;
}
function sweepX(stations, { n = 3, seg = 36, step = 3, uvScale = 0.0035 } = {}) {
  const L = crResample([...stations].sort((a, b) => a.x - b.x), ['x', 'yt', 'yb', 'w'], 'x', step);
  const pos = [], uv = [], idx = [];
  const pt = (s, t) => { const c = Math.cos(t), sn = Math.sin(t);
    return [s.x, (s.yt + s.yb) / 2 + (s.yt - s.yb) / 2 * Math.sign(sn) * Math.pow(Math.abs(sn), 2 / n), s.w / 2 * Math.sign(c) * Math.pow(Math.abs(c), 2 / n)]; };
  L.forEach(s => { for (let i = 0; i <= seg; i++) { const t = i / seg * Math.PI * 2; pos.push(...pt(s, t)); uv.push(s.x * uvScale, i / seg); } });
  for (let k = 0; k < L.length - 1; k++) for (let i = 0; i < seg; i++) {
    const a = k * (seg + 1) + i, b = a + 1, c = a + seg + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  for (const [s, first] of [[L[0], true], [L[L.length - 1], false]]) {
    const base = pos.length / 3;
    for (let i = 0; i < seg; i++) { pos.push(...pt(s, i / seg * Math.PI * 2)); uv.push(0, 0); }
    pos.push(s.x, (s.yt + s.yb) / 2, 0); uv.push(0, 0);
    for (let i = 0; i < seg; i++) { const a = base + i, b = base + (i + 1) % seg; first ? idx.push(base + seg, a, b) : idx.push(base + seg, b, a); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

function gear(r, teeth, th, cx, cy, cz, { hole = 0, axis = 'z' } = {}) {
  const s = new THREE.Shape(), n = teeth * 4;

    const a = i / n * Math.PI * 2, rr = (i % 4 < 2) ? r : r * (1 - Math.min(0.14, 2.4 / r));
    i ? s.lineTo(rr * Math.cos(a), rr * Math.sin(a)) : s.moveTo(rr * Math.cos(a), rr * Math.sin(a));

  if (hole) { const h = new THREE.Path(); h.absarc(0, 0, hole, 0, Math.PI * 2, true); s.holes.push(h); }
  const g = new THREE.ExtrudeGeometry(s, { depth: th, bevelEnabled: false, curveSegments: 4 });

function resample(poly, n) {
  const d = [0]; for (let i = 1; i < poly.length; i++) d.push(d[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));

  for (let k = 0; k < n; k++) {
    const s = d[d.length - 1] * k / (n - 1); let i = 1; while (i < d.length - 1 && d[i] < s) i++;
    const t = (s - d[i - 1]) / (d[i] - d[i - 1] || 1);

// Layout: model units are pixels of the 1152px Airsoft Station left-side product photo (muzzle left in the photo).
// X = OX - px puts the muzzle at +x; Y = OY - py puts the bore axis at y = 0. z is the gun's right side.
// Scale S = 0.823 mm/px: the photo spans 1069px from brake to butt (real AKM 880mm) and 1109px with the orange
// tip (manual: 915mm). The whole model is scaled by S so world units are mm; widths are given in mm via mm().
const S = 0.823, OX = 578, OY = 103.5;
const X = px => OX - px, Y = py => OY - py;
const P = pts => pts.map(([a, b]) => [OX - a, OY - b]);

const GT_Y = Y(72), GT_R = mm(9.5);      // gas tube axis and radius

// annular sector around an x-axis line at height cy: angles in the (z, y) plane from +z toward +y
function sectorX(rIn, rOut, a0, a1, xA, xB, cy, seg = 40) {
  const sh = new THREE.Shape();
  for (let i = 0; i <= seg; i++) { const a = a0 + (a1 - a0) * i / seg, v = [rOut * Math.cos(a), rOut * Math.sin(a)]; i ? sh.lineTo(...v) : sh.moveTo(...v); }
  for (let i = seg; i >= 0; i--) { const a = a0 + (a1 - a0) * i / seg; sh.lineTo(rIn * Math.cos(a), rIn * Math.sin(a)); }
  const g = new THREE.ExtrudeGeometry(sh, { depth: Math.abs(xB - xA), bevelEnabled: false, curveSegments: 4 });
  g.rotateY(-Math.PI / 2); g.translate(Math.max(xA, xB), cy, 0);
  const P = g.attributes.position, uv = g.attributes.uv;          // grain runs along x
  for (let i = 0; i < P.count; i++) uv.setXY(i, P.getX(i) * 0.0035, Math.atan2(P.getY(i) - cy, P.getZ(i)) / Math.PI);
  return g;
}
// AKM lower handguard: superellipse section swept along x (photo px), with the vent notches in the top edge, the recessed
// side panel that ends in the rear palm swell (RedWolf CM048M right side, Atlantic/Apex AKM side views) and a front tenon
function lowerHGGeo(px0, px1, grow = 0, notches = true) {
  const K = (a, b, e, x) => Math.min(1, Math.max(0, (x - a) / e)) * Math.min(1, Math.max(0, (b - x) / e));
  const lerpT = (tab, x) => { for (let i = 0; i < tab.length - 1; i++) if (x <= tab[i + 1][0]) { const t = (x - tab[i][0]) / (tab[i + 1][0] - tab[i][0]), u = t * t * (3 - 2 * t); return tab[i][1] + (tab[i + 1][1] - tab[i][1]) * u; } return tab[tab.length - 1][1]; };

  const W = [[307, 35], [330, 37.5], [400, 40], [440, 42.5], [470, 43], [486, 42], [492, 40]];
  const n = 3.2, seg = 160, pos = [], idx = [], xs = [];
  for (let px = px0; px <= px1 + 1e-6; px += 0.5) xs.push(px);
  const sec = px => {
    const ten = 1 - Math.min(1, Math.max(0, (px - 311) / 1.5));                    // front tenon into the retainer cup
    const notch = notches ? 2.6 * (K(325, 352, 2, px) + K(387, 417, 2, px)) : 0;
    const yt = Y(83 + notch + ten * 1.2) + grow, yb = Y(lerpT(YB, px) - ten * 1.5) - grow;
    const hw = mm(lerpT(W, px) - ten * 3.5) / 2 + grow, yc = (yt + yb) / 2, hh = (yt - yb) / 2;
    const out = [];
    for (let i = 0; i < seg; i++) {
      const t = i / seg * Math.PI * 2, c = Math.cos(t), sn = Math.sin(t);
      const y = yc + hh * Math.sign(sn) * Math.abs(sn) ** (2 / n);
      let z = hw * Math.sign(c) * Math.abs(c) ** (2 / n);
      // recessed side panel: flat-bottomed oval pocket, rounded rear end, open toward the front cap
      const qx = Math.max(0, (px - 395) / 24), qy = (Y(103.5) - y) / mm(12.5);
      const inPanel = px > 309 ? Math.min(1, Math.max(0, (1 - (qx * qx + qy * qy)) / 0.18)) : 0;
      z -= Math.sign(c) * mm(2.2) * inPanel * Math.min(1, Math.abs(c) ** 2 * 1.6);
      out.push([y, z]);
    }

  xs.forEach(px => sec(px).forEach(([y, z]) => pos.push(X(px), y, z)));

  }

    const base = pos.length / 3, ring = sec(xs[k]);
    pos.push(X(xs[k]), ring.reduce((m, [y]) => m + y / seg, 0), 0);
    for (let i = 0; i < seg; i++) { const a = k * seg + i, b = k * seg + (i + 1) % seg; flip ? idx.push(base, a, b) : idx.push(base, b, a); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const uv = []; for (let i = 0; i < pos.length; i += 3) uv.push(pos[i] * 0.0035, (pos[i + 1] + pos[i + 2]) * 0.01);
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));

}

// AKM stamped dust cover: sheet (outer + inner skin) swept along x. Section from the end-on photos (K-Var Arsenal cover):
// half-round crown over the recoil spring, flared shoulders, straight skirts. Skirt heights, ribs, flutes and the raked rear
// traced from the CM048M side photo (left) and the RedWolf right-side close-up.
function akmCover() {
  const H = mm(31.5), Wh = RZ + mm(1.2), rc = mm(9.4), T = mm(0.9), top = Y(56);
  const ramp = (px, a, b) => Math.min(1, Math.max(0, (px - a) / (b - a)));
  const bump = (px, a, b, e) => ramp(px, a, a + e) * (1 - ramp(px, b - e, b));
  // skirt bottom depth per side (0 = top), by photo px
  const botL = px => H - mm(6) * (1 - ramp(px, 565, 587));
  const botR = px => H - (H * 0.45) * (1 - ramp(px, 610, 628));
  const rib = px => [555, 635, 717].reduce((a, r) => a + mm(1) * Math.exp(-(((px - r) / 2.3) ** 2)), 0);
  const flute = (px, u, a, b) => (u > 0.45 && u < 0.72) ? -mm(0.7) * bump(px, a, b, 4) * Math.sin((u - 0.45) / 0.27 * Math.PI) : 0;
  // short grooves along the crown top, one per bay between the ribs (K-Var and Apex side views)
  const groove = px => -mm(0.8) * [[563, 625], [649, 714], [725, 773]].reduce((a, [s, e]) => a + bump(px, s, e, 3), 0);
  // raked rear face: a plane through photo (777, 56) and (812, 85); column end x for a point at depth d
  const RK = 35 / 29, xEnd = d => Math.min(814, 777 + d * RK);
  // half profile, top centre outwards: [z, d, ribWeight, skirtU or -1, topWeight]
  const half = (bot) => {
    const pts = [];
    for (let i = 0; i <= 20; i++) { const a = Math.PI / 2 * (1 - i / 20); pts.push([rc * Math.cos(a), rc - rc * Math.sin(a), 1, -1, Math.exp(-(((Math.PI / 2 - a) / 0.26) ** 2))]); }
    pts.push([rc, 0.36 * H, 1, -1, 0]);
    for (let i = 1; i <= 7; i++) { const t = i / 7, sm = t * t * (3 - 2 * t); pts.push([rc + (Wh - rc) * sm, 0.36 * H + 0.14 * H * t, 1 - t, -1, 0]); }
    const d0 = 0.5 * H, d1 = Math.max(bot, d0 + mm(1.5));
    for (let i = 1; i <= 10; i++) pts.push([Wh, d0 + (d1 - d0) * i / 10, 0, i / 10 * (d1 - d0) / (H - d0), 0]);
    return pts;
  };
  const profile = px => {
    const R = half(botR(px)), L = half(botL(px));
    const pts = [...L.slice(1).reverse().map(([z, ...r]) => [-z, ...r, -1]), ...R.map(([z, ...r]) => [z, ...r, 1])];
    return pts.map((p, i) => {   // outward normal in (z, y = -d)
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let nz = -(b[1] - a[1]), ny = -(b[0] - a[0]); const l = Math.hypot(nz, ny) || 1; nz /= l; ny /= l;
      if (nz * p[0] + ny * (0.6 * H - p[1]) < 0) { nz = -nz; ny = -ny; }
      return { z: p[0], d: p[1], w: p[2], u: p[3], tw: p[4], side: p[5], nz, ny };
    });
  };
  const outer = (q, px, inner) => {
    const off = rib(px) * q.w + groove(px) * q.tw + (q.u >= 0 ? flute(px, q.u, q.side < 0 ? 590 : 630, 805) : 0) - (inner ? T : 0);
    return [q.z + q.nz * off, q.d - q.ny * off];
  };
  // every profile column runs from the front edge to where it meets the rake (or the rear edge), so the rake edge is exact
  const M0 = 258, M1 = 70, prof0 = profile(519), N = prof0.length;
  const colX = (i, k, inner) => {
    const q = prof0[i], dEnd = inner ? q.d + q.ny * T : q.d, xe = xEnd(Math.max(0, dEnd));
    return k <= M0 ? 519 + (777 - 519) * k / M0 : 777 + (xe - 777) * (k - M0) / M1;
  };
  const pos = [], idx = [], K = M0 + M1 + 1;
  const vid = (k, i, inner) => (k * N + i) * 2 + inner;
  const cache = new Map(), profAt = px => { const key = px.toFixed(3); if (!cache.has(key)) cache.set(key, profile(px)); return cache.get(key); };
  for (let k = 0; k < K; k++) for (let i = 0; i < N; i++) for (const inner of [0, 1]) {
    const px = colX(i, k, inner), [z, d] = outer(profAt(px)[i], px, inner);
    pos.push(X(px), top - d, z);
  }
  for (let k = 0; k < K - 1; k++) for (let i = 0; i < N - 1; i++) {
    const a = vid(k, i, 0), b = vid(k, i + 1, 0), c = vid(k + 1, i, 0), d = vid(k + 1, i + 1, 0);
    idx.push(a, b, c, b, d, c); idx.push(a + 1, c + 1, b + 1, b + 1, c + 1, d + 1);
  }
  for (let k = 0; k < K - 1; k++) for (const i of [0, N - 1]) {      // bottom edges of the skirts
    const a = vid(k, i, 0), b = vid(k, i, 1), c = vid(k + 1, i, 0), d = vid(k + 1, i, 1); idx.push(a, b, c, b, d, c);
  }
  for (let i = 0; i < N - 1; i++) { const a = vid(0, i, 0), b = vid(0, i + 1, 0); idx.push(a, a + 1, b, b, a + 1, b + 1); }   // open front rim
  const shell = new THREE.BufferGeometry();
  shell.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  shell.setIndex(idx); shell.computeVertexNormals();
  // rear wall: the outer column ends, triangulated in (z, d) and flat shaded so the rake edge stays crisp
  const ends = Array.from({ length: N }, (_, i) => pos.slice(vid(K - 1, i, 0) * 3, vid(K - 1, i, 0) * 3 + 3));
  const tris = THREE.ShapeUtils.triangulateShape(ends.map(([, y, z]) => new THREE.Vector2(z, y)), []);
  const cp = []; for (const t of tris) for (const j of t) cp.push(...ends[j]);
  const cap = new THREE.BufferGeometry(); cap.setAttribute('position', new THREE.Float32BufferAttribute(cp, 3)); cap.computeVertexNormals();
  return [shell, cap];
}

// ---------- UI: list ----------
const list = document.getElementById('list');
const byCat = {};
for (const p of parts) (byCat[p.userData.cat] ||= []).push(p);
const itemEls = new Map();
const catOn = {};
let build = 'aeg';
function updateVis() {
  for (const p of parts) {
    const d = p.userData;
    const ok = !d.variant || d.variant === build;
    p.visible = catOn[d.cat] && ok;
    itemEls.get(p).classList.toggle('off', !ok);
  }
}
for (const [key, label] of Object.entries(CATS)) {
  catOn[key] = true;
  const head = document.createElement('label'); head.className = 'cat';
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
  cb.onchange = () => { catOn[key] = cb.checked; updateVis(); };
  head.append(cb, label + ` (${byCat[key].length})`);
  list.append(head);
  for (const p of byCat[key]) {
    const it = document.createElement('div'); it.className = 'item';
    const d = p.userData;
    it.innerHTML = `<span>${d.name}</span><span class="pn">${d.nos.length ? '#' + d.nos[0] : d.tag}</span>`;
    it.onclick = () => select(p, true);
    list.append(it); itemEls.set(p, it);
  }
}
const hpaCb = document.getElementById('hpa');
hpaCb.onchange = () => { build = hpaCb.checked ? 'hpa' : 'aeg'; updateVis(); if (!selected) showOverview(); };
updateVis();

// ---------- explode ----------
const exSlider = document.getElementById('explode');
let exTarget = 0, exCur = 0;
exSlider.oninput = () => exTarget = +exSlider.value;
document.getElementById('bAsm').onclick = () => { exTarget = 0; exSlider.value = 0; };
const EXP_POS = new THREE.Vector3(120, 260, 1750), EXP_TGT = new THREE.Vector3(0, 20, 0);
document.getElementById('bExp').onclick = () => { exTarget = 1; exSlider.value = 1; camTween = { pos: EXP_POS.clone(), tgt: EXP_TGT.clone() }; };
let camTween = null;
document.getElementById('bReset').onclick = () => { camTween = { pos: HOME_POS.clone(), tgt: HOME_TGT.clone() }; };
const spin = document.getElementById('spin');
spin.onchange = () => controls.autoRotate = spin.checked;

document.getElementById('xray').onchange = e => {
  for (const p of parts) if (p.userData.shell) p.traverse(o => {
    if (!o.isMesh) return;
    o.material.transparent = e.target.checked;
    o.material.opacity = e.target.checked ? 0.09 : 1;
    o.material.depthWrite = !e.target.checked;
  });
};

<a href="https://airsoftstation.com/cyma-cm048m-ak47-full-metal-real-wood-airsoft-rifle/">Airsoft Station</a> (side photo used for tracing),
<a href="https://robertforbus.com/ak-part-drawings/akm-receiver/">Robert Forbus AKM drawings</a>,
<a href="https://get.vegaforce.com/downloads/AKM_AKMS_PARTS_LIST.pdf">VFC AKM/AKMS parts list</a> (the gun CYMA copies; AKM-xx cross-reference),
<a href="http://airsofttech.dk/Guides.cshtml?Page=GearboxV3_Page1">airsofttech.dk V3 guide</a>,
<a href="https://www.polarstarairsoft.com/">Polarstar Kythera manual</a>. Shapes and positions are approximate, traced from product photos, not measured.</p>`;
function showOverview() {
  info.innerHTML = `<h2>CYMA CM.048M (AKM, full metal, real wood)</h2>
  <div class="meta">AEG, Version 3 gearbox. Semi and full auto.</div>
  <p>Manual spec: 915mm long (with orange tip), 3310g with battery, 120 m/s (about 394 fps) on 0.20g, 700 to 850 rounds/min, 600-round hi-cap. Steel receiver and dust cover, zinc alloy barrel and sights, real wood stock and handguards, polymer grip.</p>
  <ul>
    <li>The CM048M copies the VFC AKM AEG. Each part panel lists the matching VFC AKM-xx part. VFC sells the gearbox, motor holder and magazine as single sets (AKM-22, AKM-24, AKM-30), so the internals have no finer VFC numbers.</li>
    <li>CYMA numbering: CM.048 is the AK74-pattern gun and CM.048M the AKM. The manual covers both; "M" part numbers (15M, 26M to 30M, 37M, 53M, 55M, 66M, 67M, 73M) are the AKM versions. The receiver, dust cover, rear sight, grip, gearbox and hop-up are shared.</li>
    <li>Battery lives in the stock behind the butt plate (2 screws), mini Tamiya plug, 20A fuse.</li>
    <li>Hop-up: lock the cocking lever back or pop the dust cover and slide the adjuster.</li>
    <li>Motor mesh: M3 hex screw through the grip bottom. Hold the grip while adjusting.</li>
    <li>Weak points reported by owners: loose selector lever screw, BBs or debris jamming the selector plate, front sight play, motor whine until the height is set, air seal.</li>
    <li>Scale: traced from a side product photo at 0.823 mm/px (real AKM 880mm without tip, 915mm with it). Widths come from the Forbus AKM drawings and retail listings. The traced receiver is about 267mm against 259mm on the real AKM.</li>
    <li>Owner build (tick "Owner build" in the controls): ZCI 455mm 6.02 barrel, R-hop, G&amp;G green bucking and a Polarstar Kythera V3 HPA engine in place of the AEG cylinder, gears and motor.</li>
  </ul>
  <p>${parts.length} modeled assemblies covering ${byNo.size} of ${MANUAL.length} manual part numbers. Showing the ${build === 'hpa' ? 'owner HPA build' : 'stock AEG'}. Drag to orbit, scroll to zoom, right-drag to pan.</p>${SOURCES}`;
}
function showList(hitNos = []) {
  const rows = MANUAL.map(([no, name, note]) => {
    const mod = byNo.has(no);
    return `<tr class="${mod ? 'mod' : ''} ${hitNos.includes(no) ? 'hit' : ''}" data-no="${no}"><td>#${no}</td><td>${name}</td><td>${note}</td></tr>`;
  }).join('');
  info.innerHTML = `<h2>Manual parts list (${MANUAL.length})</h2><div class="meta">Names as printed in the CYMA manual (English column, original spelling). Blue rows are modeled, click to find them. Unmarked numbers are the AK74 (CM.048) versions where an "M" version exists.</div><table>${rows}</table>`;
  info.querySelectorAll('tr.mod').forEach(tr => tr.onclick = () => select(byNo.get(tr.dataset.no), true));
}
document.getElementById('bList').onclick = () => showList(selected ? selected.userData.nos : []);
document.getElementById('bInfo').onclick = () => select(null);

// ---------- selection ----------
let selected = null;
function setGlow(p, on, col = 0x2f6bff) {
  p.traverse(o => { if (o.isMesh) {
    o.material.emissive.setHex(on ? col : o.userData.baseEmissive);
    o.material.emissiveIntensity = on ? 0.55 : 1;
  } });
}
function select(p, focus = false) {
  if (selected) { setGlow(selected, false); itemEls.get(selected).classList.remove('sel'); selected.userData.label.element.classList.remove('sel'); }
  selected = p;
  if (!p) { showOverview(); return; }
  setGlow(p, true);
  itemEls.get(p).classList.add('sel');
  itemEls.get(p).scrollIntoView({ block: 'nearest' });
  p.userData.label.element.classList.add('sel');
  const d = p.userData;
  const rows = d.nos.map(n => MANUAL.find(r => r[0] === n)).filter(Boolean)
    .map(([no, name, note]) => `<tr><td>#${no}</td><td>${name}</td><td>${note}</td></tr>`).join('');
  const note = d.nos.length ? '<p class="src">Names as printed in the CYMA manual.</p>' : '<p class="src">Not broken down in the CYMA manual (the gearbox is item 7); generic V3 / aftermarket name.</p>';
  const vfc = (VFC[d.id] || []).map(n => `AKM-${n} ${VFC_NAMES[n]}`).join(', ');
  info.innerHTML = `<h2>${d.name}</h2><div class="meta">${CATS[d.cat]}${d.variant === 'hpa' ? ' (owner build only)' : d.variant === 'aeg' ? ' (stock AEG only)' : ''}</div><p>${d.info}</p>
    <table>${rows}</table>${note}${vfc ? `<p class="src">VFC AKM equivalent: ${vfc}.</p>` : ''}${SOURCES}`;
  if (focus) {
    const w = new THREE.Vector3(); d.label.getWorldPosition(w);
    const dir = camera.position.clone().sub(controls.target).normalize();
    camTween = { tgt: w, pos: w.clone().add(dir.multiplyScalar(700)) };
  }
}
showOverview();

// ---------- picking ----------
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
const tip = document.getElementById('tip');
let hovered = null, downAt = null;
function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(meshes.filter(m => m.parent.visible), false)
    .find(h => !(h.object.material.transparent && h.object.material.opacity < 0.5));
  return hit ? hit.object.userData.part : null;
}
renderer.domElement.addEventListener('pointermove', e => {
  const p = pick(e);
  if (hovered && hovered !== selected) setGlow(hovered, false);
  hovered = p;
  if (p && p !== selected) setGlow(p, true, 0x3a3f4a);
  tip.style.display = p ? 'block' : 'none';
  if (p) { const d = p.userData; tip.textContent = `${d.nos.length ? '#' + d.nos[0] + ' ' : ''}${d.name}`; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 10 + 'px'; }
  renderer.domElement.style.cursor = p ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  select(pick(e));
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

// ---------- loop ----------
root.scale.setScalar(S);
const exv = document.getElementById('exv');
renderer.setAnimationLoop(() => {
  exCur += (exTarget - exCur) * 0.12;
  if (Math.abs(exTarget - exCur) < 1e-4) exCur = exTarget;
  exv.textContent = Math.round(exCur * 100) + '%';
  const e = exCur * exCur * (3 - 2 * exCur);
  for (const p of parts) {
    p.position.copy(p.userData.explode).multiplyScalar(e);
    p.userData.label.visible = p.visible && (p === selected || (labelsCb.checked && exCur > 0.25));
  }
  if (camTween) {
    controls.target.lerp(camTween.tgt, 0.1); camera.position.lerp(camTween.pos, 0.1);
    if (camera.position.distanceTo(camTween.pos) < 2) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

const fromHash = () => {
  if (location.hash.includes('exploded')) { exTarget = 1; exSlider.value = 1; labelsCb.checked = true; camTween = { pos: EXP_POS.clone(), tgt: EXP_TGT.clone() }; }
  if (location.hash.includes('hpa')) { hpaCb.checked = true; hpaCb.onchange(); }
};
fromHash(); addEventListener('hashchange', fromHash);
window.__cm = { parts, select, showList, THREE, scene, renderer, camera, controls, floor, grid, labelRenderer, root, S, OX, OY };
</script>
</body>
</html>
