<script type="module">

const MANUAL = [["G-01", "Lower frame", false], ["G-02", "Slide release lever (takedown lever)", false], ["G-03", "Serial number safety bar (serial plate)", false], ["G-04", "Magazine release spring", false], ["G-05", "Trigger locking pin (trigger pin)", false], ["G-06", "Magazine catch", false], ["G-07", "Hammer assembly locking pin (trigger housing pin)", false], ["G-08", "Front assembly housing (front chassis / locking block analog)", false], ["G-09", "Front assembly screw", false], ["G-10", "Front assembly housing pin", false], ["G-11", "Slide release retention spring (takedown lever spring)", false], ["G-12", "Slide catch (slide stop lever)", false], ["G-13", "Slide lock spring (slide stop spring)", false], ["G-14", "Trigger bar pin", false], ["G-15", "Trigger safety blade", true], ["G-16", "Trigger", false], ["G-17", "Trigger bar spring", false], ["G-18", "Trigger bar", false], ["G-19", "Valve knocker (valve striker / 'firing pin')", false], ["G-20", "Hammer", false], ["G-21", "Hammer roller", false], ["G-22", "Hammer spring", false], ["G-23", "Hammer sear", false], ["G-24", "Hammer reset spring (sear spring)", false], ["G-25", "Hammer unit screw", false], ["G-26", "Hammer housing", false], ["G-27", "Valve knocker pop-up sear", false], ["G-28", "Pop-up sear spring", false], ["G-29", "Hammer pin upper", false], ["G-30", "Hammer pin lower", false], ["G-31", "Recoil spring guide rod", false], ["G-32", "Recoil spring", false], ["G-33", "Recoil spring guide end / buffer ring", false], ["G-34", "Hop-up chamber screws (x2)", false], ["G-35", "Hop-up chamber left half", false], ["G-36", "Hop-up bucking", false], ["G-37", "Hop-up chamber arm", false], ["G-38", "Inner barrel", false], ["G-39", "Outer barrel", false], ["G-40", "Hop-up chamber right half", false], ["G-41", "Hop-up wheel O-ring / detent", true], ["G-42", "Hop-up adjustment wheel", false], ["G-43", "Slide", false], ["G-44", "Front sight", true], ["G-45", "Front sight screw", true], ["G-46", "Rear sight", false], ["G-47", "Loading nozzle", false], ["G-48", "Nozzle screw", false], ["G-49", "Nozzle (valve) spring", false], ["G-50", "Nozzle valve", false], ["G-51", "Nozzle valve blocker", false], ["G-53", "Nozzle return spring", false], ["G-54", "Blowback unit (BBU) nozzle housing", false], ["G-54-1", "Rear slide plate (cover plate)", false], ["G-55", "Piston head screw", false], ["G-56", "Piston head", false], ["G-58", "Rear sight screw", false], ["G-59", "Magazine shell (body)", false], ["G-60", "Magazine out (exhaust) valve", false], ["G-61", "Magazine feed lip pin", false], ["G-62", "Magazine feed lips", false], ["G-63", "Magazine gas route (rubber gasket)", false], ["G-64", "Magazine follower", false], ["G-65", "Magazine spring", false], ["G-66", "Magazine bumper stopper (baseplate catch)", false], ["G-67", "Magazine base plate", false], ["G-68", "Magazine fill (intake) valve", false], ["G-69", "Magazine gas tank O-ring / gasket", true], ["G-70", "Magazine base (gas tank base)", false], ["G-71", "Magazine screw", false], ["G-72", "Magazine screw O-ring / washer (lower)", true], ["G-73", "Magazine screw O-ring / washer (upper)", true], ["G-74", "Spring guide slide spacer (front slide cushion)", false], ["G-75", "Slide piece (dummy extractor)", false], ["G-76", "Small slide insert block", false]];

// ---------- scene ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111317);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 20000);
const HOME_TGT = new THREE.Vector3(-5, -45, 0);
// Pull the camera back on narrow screens so the whole gun fits the width.
const fit = (pos, tgt) => pos.sub(tgt).multiplyScalar(Math.max(1, 1.55 / camera.aspect)).add(tgt);
const HOME_POS = fit(new THREE.Vector3(-90, 40, -420), HOME_TGT);
camera.position.copy(HOME_POS);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
// orthographic twin of the orbit camera: follows its position and turn, and sizes its frustum so the target plane
// matches the perspective view, so orbit, dolly and zoom-to keep working in either mode
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, -20000, 20000);
let useOrtho = false;
const viewCam = () => useOrtho ? ortho : camera;
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x2a2c30, 0.9));
const rim = new THREE.DirectionalLight(0x9fb8ff, 0.9);
rim.position.set(-600, 300, -700);
scene.add(rim);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-200, 700, -350);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 10, far: 3000 });
scene.add(sun);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.ShadowMaterial({ opacity: 0.25 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -260; floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(1600, 64, 0x2a2f38, 0x1d2027);
grid.position.y = -259.5; scene.add(grid);

// ---------- materials ----------
const MAT = {
  alu:    { color: 0x3b3f46, metalness: 0.7,  roughness: 0.4 },
  steel:  { color: 0x6b7079, metalness: 0.9,  roughness: 0.32 },
  dark:   { color: 0x464a52, metalness: 0.8,  roughness: 0.38 },
  zinc:   { color: 0x4d5158, metalness: 0.7,  roughness: 0.45 },
  poly:   { color: 0x2e3035, metalness: 0.0,  roughness: 0.72 },
  poly2:  { color: 0x383b41, metalness: 0.0,  roughness: 0.65 },
  brass:  { color: 0xc59b52, metalness: 0.95, roughness: 0.28 },
  rubber: { color: 0x8a2222, metalness: 0.0,  roughness: 0.6 },
  black:  { color: 0x08090a, metalness: 0.0,  roughness: 0.9 },
  spring: { color: 0xa9afb8, metalness: 0.95, roughness: 0.25 },
  red:    { color: 0xc8322a, metalness: 0.1,  roughness: 0.5 },
  orange: { color: 0xd06a1c, metalness: 0.1,  roughness: 0.55 },
  lever:  { color: 0x74777d, metalness: 0.1,  roughness: 0.6 },
  checker: { color: 0x2b2d31, metalness: 0.0, roughness: 0.95 },
  fiber:  { color: 0x3fd24a, metalness: 0.0,  roughness: 0.3, emissive: 0x0d3a10 },
  slide:  { color: 0x24262b, metalness: 0.55, roughness: 0.45 },
  nylon:  { color: 0x1c1d20, metalness: 0.0,  roughness: 0.55 },
  white:  { color: 0xe8e8e8, metalness: 0.0,  roughness: 0.5 },
  frame:  { color: 0x1d1e21, metalness: 0.0,  roughness: 0.85 },
};

// ---------- geometry helpers (x = along gun, muzzle +; y = up; z = right side) ----------
function prof(pts, depth, bevel = 1.2, holes = []) {
  const s = new THREE.Shape();
  pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));
  for (const h of holes) {
    const p = new THREE.Path();
    h.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y));
    s.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 });
  g.translate(0, 0, -depth / 2);
  return g;
}
// lathe around the x axis: pts = [[radius, x], ...]
function latheX(pts, seg = 36, y = 0, z = 0, phiStart = 0) {
  // one lathe strip per profile segment, merged: keeps corners crisp instead of smoothing normals across them
  const strips = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [r0, x0] = pts[i], [r1, x1] = pts[i + 1];
    if (r0 === r1 && x0 === x1) continue;
    strips.push(new THREE.LatheGeometry([new THREE.Vector2(r0, x0), new THREE.Vector2(r1, x1)], seg, phiStart));
  }
  const g = strips.length === 1 ? strips[0] : mergeGeometries(strips);
  g.rotateZ(-Math.PI / 2);
  g.translate(0, y, z);
  return g;
}
const tube = (ri, ro, x0, x1, seg = 32, y = 0) => latheX([[ri, x0], [ro, x0], [ro, x1], [ri, x1], [ri, x0]], seg, y);
function bx(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}
function cyl(r, len, axis, cx, cy, cz, seg = 24) {
  const g = new THREE.CylinderGeometry(r, r, len, seg);
  if (axis === 'x') g.rotateZ(Math.PI / 2);
  if (axis === 'z') g.rotateX(Math.PI / 2);
  g.translate(cx, cy, cz);
  return g;
}
class Helix extends THREE.Curve {
  constructor(r, len, turns) { super(); this.r = r; this.len = len; this.turns = turns; }
  getPoint(t, v = new THREE.Vector3()) {
    const a = t * this.turns * Math.PI * 2;
    return v.set(t * this.len, this.r * Math.cos(a), this.r * Math.sin(a));
  }
}
// spring along +x from origin, then oriented: axis 'x' | 'y' | 'z'
function spring(r, wire, len, turns, axis, cx, cy, cz) {
  const g = new THREE.TubeGeometry(new Helix(r, len, turns), Math.max(24, Math.round(turns * 14)), wire, 6, false);
  if (axis === 'y') g.rotateZ(Math.PI / 2);
  if (axis === 'z') g.rotateY(-Math.PI / 2);
  g.translate(cx, cy, cz);
  return g;
}
function torus(r, t, axis, cx, cy, cz) {
  const g = new THREE.TorusGeometry(r, t, 10, 32);
  if (axis === 'x') g.rotateY(Math.PI / 2);
  if (axis === 'y') g.rotateX(Math.PI / 2);
  g.translate(cx, cy, cz);
  return g;
}
// loft through horizontal sections: levels = [{ y, xf, xb, w }] (front x, back x, width), top to bottom.
// Levels are resampled with Catmull-Rom so the sides stay smooth; sections are rounded rectangles
// (superellipse, exponent n) with the front edge narrowed by frontTaper. Caps get their own vertices so they shade flat.
function loftResample(levels, step) {
  const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  const L = [];
  for (let k = 0; k < levels.length - 1; k++) {
    const a = levels[Math.max(0, k - 1)], b = levels[k], c = levels[k + 1], d = levels[Math.min(levels.length - 1, k + 2)];
    const steps = Math.max(1, Math.round(Math.abs(b.y - c.y) / step));
    for (let q = 0; q < steps; q++) {
      const t = q / steps, o = {};
      for (const key of ['y', 'xf', 'xb', 'w']) o[key] = cr(a[key], b[key], c[key], d[key], t);
      L.push(o);

  }
  L.push(levels[levels.length - 1]);
  return L;
}
function loftPoint(lv, t, n, frontTaper) {
  const cx = (lv.xf + lv.xb) / 2, ax = (lv.xf - lv.xb) / 2, c = Math.cos(t), sn = Math.sin(t);
  const px = Math.sign(c) * Math.pow(Math.abs(c), 2 / n), pz = Math.sign(sn) * Math.pow(Math.abs(sn), 2 / n);
  return [cx + ax * px, lv.y, (lv.w / 2) * pz * (c > 0 ? 1 - (1 - frontTaper) * c * c : 1)];
}
// curved patch lying on a loft surface: t0..t1 around the section, y0..y1 down the body, lifted `lift` mm along z
function loftPatch(levels, { t0, t1, y0, y1, lift = 0.5, n = 2.8, frontTaper = 0.7, step = 1.5, cols = 16, uvScale = 0.12 }) {
  const L = loftResample(levels, step).filter(lv => lv.y <= y0 && lv.y >= y1);
  const pos = [], uv = [], idx = [];
  L.forEach(lv => { for (let i = 0; i <= cols; i++) {
    const t = t0 + (t1 - t0) * i / cols, [x, y, z] = loftPoint(lv, t, n, frontTaper);
    pos.push(x, y, z + Math.sign(z) * lift); uv.push(x * uvScale, y * uvScale);
  } });
  for (let k = 0; k < L.length - 1; k++) for (let i = 0; i < cols; i++) {
    const a = k * (cols + 1) + i, b = a + 1, c = a + cols + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function loft(levels, { n = 2.8, seg = 40, step = 1.5, frontTaper = 0.7 } = {}) {
  const L = loftResample(levels, step);
  const pos = [], idx = [];
  const ring = (lv) => { const out = []; for (let i = 0; i < seg; i++) out.push(loftPoint(lv, (i / seg) * Math.PI * 2, n, frontTaper)); return out; };
  L.forEach(lv => ring(lv).forEach(v => pos.push(...v)));
  for (let k = 0; k < L.length - 1; k++) for (let i = 0; i < seg; i++) {
    const a = k * seg + i, b = k * seg + (i + 1) % seg, c = a + seg, d = b + seg;
    idx.push(a, b, c, b, d, c);
  }
  for (const [lv, flip] of [[L[0], false], [L[L.length - 1], true]]) {
    const base = pos.length / 3;
    ring(lv).forEach(v => pos.push(...v));
    pos.push((lv.xf + lv.xb) / 2, lv.y, 0);
    for (let i = 0; i < seg; i++) { const a = base + i, b = base + (i + 1) % seg; flip ? idx.push(base + seg, a, b) : idx.push(base + seg, b, a); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
// diamond checkering bump texture (canvas), for grip panels
const CHECKER = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 64, 64); x.strokeStyle = '#000'; x.lineWidth = 6;
  for (let k = -64; k <= 128; k += 32) { x.beginPath(); x.moveTo(k, 0); x.lineTo(k + 64, 64); x.stroke(); x.beginPath(); x.moveTo(k, 64); x.lineTo(k + 64, 0); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.3, 0.3);
  return t;
})();
// picatinny-ish rail: base + cross teeth. face: 'up' | 'down' | 'right' | 'left'; yc shifts side rails vertically
function railFace(face, off, halfW, a0, a1, t0, t1, yc = 0) {
  if (face === 'up')    return bx(a0, a1, off + t0, off + t1, -halfW, halfW);
  if (face === 'down')  return bx(a0, a1, -off - t1, -off - t0, -halfW, halfW);
  if (face === 'right') return bx(a0, a1, yc - halfW, yc + halfW, off + t0, off + t1);
  return bx(a0, a1, yc - halfW, yc + halfW, -off - t1, -off - t0);
}
function rail(x0, x1, face, off, { halfW = 10.5, base = 6, tooth = 4, yc = 0 } = {}) {
  const out = [railFace(face, off, halfW, x0, x1, 0, base, yc)];
  for (let x = x0 + 3; x + 5.2 <= x1; x += 10) out.push(railFace(face, off, halfW - 0.5, x, x + 5.2, base, base + tooth, yc));
  return out;
}
// ribbed rail guard covering a side rail
function guard(x0, x1, face, off, { halfW = 19, yc = 0, t0 = 6 } = {}) {
  const out = [railFace(face, off, halfW, x0, x1, t0, t0 + 1.5, yc)];
  for (let x = x0 + 4; x + 6 <= x1; x += 10.8) out.push(railFace(face, off, halfW - 2, x, x + 6, t0 + 1.5, t0 + 3.5, yc));
  return out;
}
// slanted slot row on both sides of a body at |z| = zs
function slots(xs, y0, y1, zs, w = 3.4, lean = -0.3) {
  const out = [];
  for (const x of xs) for (const s of [1, -1]) {
    const g = new THREE.BoxGeometry(w, y1 - y0, 0.8); g.rotateZ(lean); g.translate(x, (y0 + y1) / 2, s * zs);
    out.push([g, 'black']);
  }
  return out;
}

const CATS = {

  frm: 'Frame and controls',
  trg: 'Trigger and hammer group',

};
const parts = [];
const meshes = [];
const root = new THREE.Group();
scene.add(root);
const byNo = new Map();

function part(id, name, cat, nos, explode, info, pieces, opts = {}) {
  const grp = new THREE.Group();
  grp.userData = { id, name, cat, nos, info, explode: new THREE.Vector3(...explode), shell: !!opts.shell, slide: opts.slide === true ? Infinity : (opts.slide || 0) };
  for (const [geo, matKey] of pieces) {
    if (opts.dx) geo.translate(opts.dx, 0, 0);
    const mat = new THREE.MeshStandardMaterial({ ...MAT[matKey] });
    if (matKey === 'checker') { mat.bumpMap = CHECKER; mat.bumpScale = 2.5; }
    if (geo.type === 'LatheGeometry') mat.side = THREE.DoubleSide;
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = true; m.receiveShadow = true;
    m.userData.part = grp; m.userData.baseEmissive = mat.emissive.getHex();
    grp.add(m); meshes.push(m);
  }
  const c = new THREE.Box3().setFromObject(grp).getCenter(new THREE.Vector3());
  const el = document.createElement('div'); el.className = 'lbl';
  el.textContent = (nos.length ? nos[0] + ' ' : '') + name;
  const lbl = new CSS2DObject(el); lbl.position.copy(c); lbl.visible = false;
  grp.add(lbl);
  grp.userData.label = lbl;
  root.add(grp); parts.push(grp);
  for (const n of nos) byNo.set(n, grp);
  return grp;
}

// Layout: world units are mm. x = along the gun (muzzle +), y = up, z = right side.
// Side profiles are traced from WE's official Gen3 left-side product photo (1920px) at 8.22 px/mm. At that scale the photo
// gives 185mm overall (WE spec 185mm) and a 174mm slide (Glock spec 174mm). Internal parts are placed from the WE exploded
// view, the field-strip photos and the few published sizes (84mm inner barrel, 40mm hop chamber), so they are approximate.
const K = 8.22, OX = 900, OY = 135;
const X = px => (OX - px) / K, Y = py => (OY - py) / K;
const P = pts => pts.map(([a, b]) => [X(a), Y(b)]);
const D2R = Math.PI / 180;

// extrude a (z, y) section along x from x0 to x1
function secX(pts, x0, x1, bevel = 0.3, holes = []) {
  const g = prof(pts, x1 - x0, bevel, holes);
  g.rotateY(-Math.PI / 2); g.translate((x0 + x1) / 2, 0, 0);
  return g;
}
// rounded rectangle outline, corners of radius r
function rr(a0, a1, b0, b1, r, n = 4) {
  const pts = [];
  for (const [ca, cb, s] of [[a1 - r, b1 - r, 0], [a0 + r, b1 - r, 90], [a0 + r, b0 + r, 180], [a1 - r, b0 + r, 270]])
    for (let i = 0; i <= n; i++) { const t = (s + 90 * i / n) * D2R; pts.push([ca + r * Math.cos(t), cb + r * Math.sin(t)]); }
  return pts;
}
const circ = (ca, cb, r, n = 20) => Array.from({ length: n }, (_, i) => [ca + r * Math.cos(-i / n * 2 * Math.PI), cb + r * Math.sin(-i / n * 2 * Math.PI)]);
const zAt = (g, z) => g.translate(0, 0, z);
// like prof, but the rounded edge is cut inside the outline, so the part keeps its traced size
function profR(pts, depth, r, holes = []) {
  const s = new THREE.Shape(pts.map(([a, b]) => new THREE.Vector2(a, b)));
  for (const h of holes) s.holes.push(new THREE.Path(h.map(([a, b]) => new THREE.Vector2(a, b))));
  const g = new THREE.ExtrudeGeometry(s, { depth: depth - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelOffset: -r, bevelSegments: 4 });
  g.translate(0, 0, -(depth - 2 * r) / 2);
  return g;
}

// ---------- UI: list ----------
const list = document.getElementById('list');
const byCat = {};
for (const p of parts) (byCat[p.userData.cat] ||= []).push(p);
const itemEls = new Map();
const catOn = {};
const catEls = {};
let isolated = null;
function updateVis() {
  for (const p of parts) p.visible = isolated ? p === isolated : catOn[p.userData.cat];
}
// UI state that survives a reload: open panels (desktop only) and folded categories.
const MOBILE = matchMedia('(max-width:700px)');
const store = (() => { try { return JSON.parse(localStorage.getItem('adis-g19-ui')) || {}; } catch { return {}; } })();
const save = () => { try { localStorage.setItem('adis-g19-ui', JSON.stringify(store)); } catch {} };
store.folded ||= {};
function setFold(key, folded) {
  store.folded[key] = folded; save();
  catEls[key].car.textContent = folded ? '▸' : '▾';
  applyFilter();
}
for (const [key, label] of Object.entries(CATS)) {
  catOn[key] = true;
  const head = document.createElement('div'); head.className = 'cat';
  const car = document.createElement('span'); car.className = 'car';
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; cb.title = 'Show or hide this category';
  cb.onclick = e => e.stopPropagation();
  cb.onchange = () => { catOn[key] = cb.checked; updateVis(); };
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = label + ` (${byCat[key].length})`;
  head.append(car, cb, nm);
  head.onclick = () => setFold(key, !store.folded[key]);
  list.append(head); catEls[key] = { head, car };
  car.textContent = store.folded[key] ? '▸' : '▾';
  for (const p of byCat[key]) {
    const it = document.createElement('div'); it.className = 'item';
    it.innerHTML = `<span>${p.userData.name}</span><span class="pn">#${p.userData.nos[0]}</span>`;
    it.onclick = () => { select(p, true); if (MOBILE.matches) showPanel('side', false); };
    it.onmouseenter = () => hover(p);
    it.onmouseleave = () => hover(null);
    list.append(it); itemEls.set(p, it);
  }
}
// Search: matches the name or any manual part number. "112" and "#112" both work.
const find = document.getElementById('find');
const nohit = document.getElementById('nohit');
const hay = p => { const d = p.userData; return [d.name, ...d.nos.map(n => '#' + n)].join(' ').toLowerCase(); };
function matches(p, q) {
  if (!q) return true;
  const d = p.userData, n = q.replace(/^#/, '');
  if (d.nos.some(x => x.toLowerCase() === n)) return true;
  return q.split(/\s+/).every(w => hay(p).includes(w));
}
function applyFilter() {
  const q = find.value.trim().toLowerCase();
  let any = false;
  for (const [key] of Object.entries(CATS)) {
    let n = 0;
    for (const p of byCat[key]) {
      const m = matches(p, q); n += m;
      itemEls.get(p).classList.toggle('hid', !m || (!q && !!store.folded[key]));
    }
    catEls[key].head.classList.toggle('hid', !!q && !n);
    any ||= n > 0;
  }
  nohit.style.display = any ? 'none' : 'block';
}
find.oninput = applyFilter;
find.onkeydown = e => {
  if (e.key === 'Escape') { find.value = ''; applyFilter(); find.blur(); e.stopPropagation(); }
  if (e.key === 'Enter') { const p = parts.find(p => !itemEls.get(p).classList.contains('hid')); if (p) select(p, true); }
};
applyFilter();

    if (!o.isMesh) return;
    o.material.transparent = e.target.checked;
    o.material.opacity = e.target.checked ? 0.09 : 1;
    o.material.depthWrite = !e.target.checked;
  });
};

// ---------- panels ----------
const info = document.getElementById('info');
const infoBody = document.getElementById('infoBody');
const PANELS = { side: 'tSide', ctrl: 'tCtrl', info: 'tInfo' };
const panelEl = id => document.getElementById(id);
const isOpen = id => !panelEl(id).classList.contains('hidden');
function showPanel(id, on) {
  panelEl(id).classList.toggle('hidden', !on);
  document.getElementById(PANELS[id]).classList.toggle('on', on);
  // On a phone the parts drawer and the view menu share the same space: one at a time.
  if (on && MOBILE.matches && id !== 'info') showPanel(id === 'side' ? 'ctrl' : 'side', false);
  if (on && MOBILE.matches && id !== 'info') info.classList.add('peek');
  if (!MOBILE.matches) { store.open ||= {}; store.open[id] = on; save(); }
  document.getElementById('tAll').textContent = Object.keys(PANELS).some(isOpen) ? 'Hide all' : 'Show all';
}
for (const id in PANELS) document.getElementById(PANELS[id]).onclick = () => showPanel(id, !isOpen(id));
document.querySelectorAll('.x').forEach(b => b.onclick = () => showPanel(b.dataset.p, false));
function toggleAll() {
  const on = !Object.keys(PANELS).some(isOpen);
  for (const id in PANELS) if (!(on && MOBILE.matches && id === 'ctrl')) showPanel(id, on);
}
document.getElementById('tAll').onclick = toggleAll;
function initPanels() {
  for (const id in PANELS) showPanel(id, MOBILE.matches ? id === 'info' : store.open?.[id] ?? true);
  info.classList.toggle('peek', MOBILE.matches);
}
document.querySelector('.grab').onclick = () => info.classList.toggle('peek');
info.addEventListener('click', e => { if (info.classList.contains('peek') && !e.target.closest('button, a, .grab')) info.classList.remove('peek'); });

// ---------- info panel ----------
const SOURCES = `<p class="src">Sources: <a href="https://weairsoft.com/download.html">WE exploded views</a> (G-series semi manual, 19-V and MOS sheets),
<a href="https://weairsoft.com/guns/pistols-gas-blowback/g-series/19-series.html">WE G19 product pages</a>,
<a href="https://us.glock.com/en/products/law-enforcement/pistols/g19">Glock G19 specs</a>,
<a href="https://lantredudingo.canalblog.com/pages/review-we-g19-3e-generation-gbb-/26670286.html">lantredudingo Gen3 review</a>,
<a href="https://bravo1.blog.jp/archives/16279822.html">bravo1 G19X review</a>,
<a href="https://www.ebog-designs.co.uk/">Ebog Designs OEM parts</a>, <a href="https://www.socomtactical.net/">Socom Tactical</a>,
Non Existent's WE G19 teardown videos on YouTube. Outside shapes are traced from WE's Gen3 side photo; internal shapes and positions are approximate.</p>`;
function showOverview() {
  infoBody.innerHTML = `<h2>WE-Tech G19 Gen3 (Glock 19)</h2>
  <div class="meta">Gas blowback pistol, semi-auto. Metal slide, polymer frame with metal front and rear chassis.</div>
  <p>185mm long (WE). Weight with mag: Gen3 697g, Gen4 686g, Gen5 674g (WE). Mag 23 BBs (WE). Glock G19 for comparison: 174mm slide, 25.5mm slide width, 102mm barrel, 128mm high with mag.</p>
  <ul>
    <li>Field strip (WE manual): drop the mag, pull the slide back a few mm, pull the takedown latch down on both sides, run the slide off forward. Then the recoil guide, the outer barrel, and the inner barrel with the hop chamber out of the back of the outer barrel.</li>
    <li>Hop is set with the wheel on the side of the chamber, slide off.</li>
    <li>Gen3 and Gen4 share the internals; Gen4 changes the frame texture, adds backstraps and a bigger mag catch. Gen5 has its own frame, slide, front chassis, slide stop, recoil guide set and base plate.</li>
    <li>Known weak points: the polymer loading nozzle cracks (reinforced Guarder or CowCow nozzles fix it), pot-metal hammer and sear wear, and the blowback housing can crack around the piston bore (Ebog).</li>
    <li>The Slide slider in the View panel racks the slide: the slide, sights and blowback unit move, the barrel only a few mm.</li>
  </ul>
  <p>${parts.length} modeled assemblies covering ${byNo.size} of ${MANUAL.length} WE part numbers. Drag to orbit, scroll to zoom, right-drag to pan. Double-click a part to zoom to it.</p>
  <p class="src">Keys: / search, F zoom to the selected part, Esc show all or deselect, H hide or show panels, P parts, V view, I info, 1 to 6 front, back, top, left, right and bottom views, O orthographic. Click a face, edge or corner of the view cube to look from there, or drag it to turn the view.</p>${SOURCES}`;
}
function showList(hitNos = []) {
  const rows = MANUAL.map(([no, name, guess]) => {
    const mod = byNo.has(no);
    return `<tr class="${mod ? 'mod' : ''} ${hitNos.includes(no) ? 'hit' : ''}" data-no="${no}"><td>${no}</td><td>${name}</td><td>${guess ? '*' : ''}</td></tr>`;
  }).join('');
  infoBody.innerHTML = `<h2>Manual parts list (${MANUAL.length})</h2><div class="meta">WE prints numbers only; names are from shop listings, * marks names read off the drawing. Blue rows are modeled, click to find them.</div><table>${rows}</table>`;
  infoBody.querySelectorAll('tr.mod').forEach(tr => tr.onclick = () => select(byNo.get(tr.dataset.no), true));
}
document.getElementById('bList').onclick = () => showList(selected ? selected.userData.nos : []);
document.getElementById('bInfo').onclick = () => select(null);

// ---------- selection ----------
let selected = null;
function setGlow(p, on, col = 0x2f6bff) {
  p.traverse(o => { if (o.isMesh) {
    o.material.emissive.setHex(on ? col : o.userData.baseEmissive);
    o.material.emissiveIntensity = on ? 0.55 : 1;
  } });
}
// Hover glow, shared by the canvas and the parts list.
let hovered = null;
function hover(p) {
  if (hovered && hovered !== selected) setGlow(hovered, false);
  hovered = p;
  if (p && p !== selected) setGlow(p, true, 0x3a3f4a);
}
// Frame a part: aim at its bounding box centre and back off until the box fits the narrower field of view.
function focusOn(p) {
  const box = new THREE.Box3().setFromObject(p);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const half = Math.min(camera.fov / 2 * Math.PI / 180, Math.atan(Math.tan(camera.fov / 2 * Math.PI / 180) * camera.aspect));
  const dist = THREE.MathUtils.clamp(r / Math.sin(half) * 1.15, 25, 1500);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camTween = { tgt: c, pos: c.clone().add(dir.multiplyScalar(dist)) };
}
function isolate(p) {
  isolated = p; updateVis();
  const b = infoBody.querySelector('#bIso');
  if (b) { b.classList.toggle('on', !!p); b.textContent = p ? 'Show all (Esc)' : 'Show only this'; }
}
function select(p, focus = false) {
  if (selected) { setGlow(selected, false); itemEls.get(selected).classList.remove('sel'); selected.userData.label.element.classList.remove('sel'); }
  selected = p;
  if (!p) { if (isolated) isolate(null); showOverview(); return; }
  if (isolated) isolate(p);
  setGlow(p, true);
  const it = itemEls.get(p);
  if (it.classList.contains('hid')) {
    if (find.value) { find.value = ''; }
    store.folded[p.userData.cat] = false; save();
    catEls[p.userData.cat].car.textContent = '▾';
    applyFilter();
  }
  it.classList.add('sel');
  it.scrollIntoView({ block: 'nearest' });
  p.userData.label.element.classList.add('sel');
  const d = p.userData;
  const rows = d.nos.map(n => MANUAL.find(r => r[0] === n)).filter(Boolean)
    .map(([no, name, guess]) => `<tr><td>${no}</td><td>${name}</td><td>${guess ? '*' : ''}</td></tr>`).join('');
  infoBody.innerHTML = `<h2>${d.name}</h2><div class="meta">${CATS[d.cat]}</div>
    <div class="acts"><button id="bZoom" title="F">Zoom to</button><button id="bIso" class="${isolated ? 'on' : ''}">${isolated ? 'Show all (Esc)' : 'Show only this'}</button></div><p>${d.info}</p>
    <table>${rows}</table><p class="src">Part names from shop listings; * read off the WE drawing.</p>${SOURCES}`;
  infoBody.querySelector('#bZoom').onclick = () => focusOn(p);
  infoBody.querySelector('#bIso').onclick = () => { isolate(isolated ? null : p); if (isolated) focusOn(p); };
  infoBody.scrollTop = 0;
  if (focus) focusOn(p);
}
showOverview();
initPanels();

// ---------- picking ----------
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
const tip = document.getElementById('tip');
let downAt = null;
function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, viewCam());
  const hit = ray.intersectObjects(meshes.filter(m => m.parent.visible), false)
    .find(h => !(h.object.material.transparent && h.object.material.opacity < 0.5));
  return hit ? hit.object.userData.part : null;
}
renderer.domElement.addEventListener('pointermove', e => {
  const p = pick(e);
  hover(p);
  tip.style.display = p ? 'block' : 'none';
  if (p) { tip.textContent = `#${p.userData.nos[0]} ${p.userData.name}`; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 10 + 'px'; }
  renderer.domElement.style.cursor = p ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  select(pick(e));
});
renderer.domElement.addEventListener('dblclick', e => { const p = pick(e); if (p) select(p, true); });

// ---------- preset views ----------
// unit directions from the target to the camera: +x is the muzzle end, +z the gun's right; top and bottom lean a hair
// toward the right side so the orbit controls keep the muzzle pointing right
const VIEWS = { front: [1, 0, 0], back: [-1, 0, 0], top: [0, 1, 1e-3], left: [0, 0, -1], right: [0, 0, 1], bottom: [0, -1, 1e-3] };
const VIEW_KEYS = { 1: 'front', 2: 'back', 3: 'top', 4: 'left', 5: 'right', 6: 'bottom' };
const viewDir = dir => {
  const d = camera.position.distanceTo(controls.target);
  camTween = { tgt: controls.target.clone(), pos: dir.clone().normalize().multiplyScalar(d).add(controls.target) };
};
const viewFrom = v => viewDir(new THREE.Vector3(...VIEWS[v]));

// ---------- view cube ----------
// A labelled cube in the corner that turns with the camera. Each face is split 3 x 3: a click on the middle looks
// straight at that face, on an edge strip from between the two faces, on a corner from between three. Dragging it
// orbits the main camera.
const cubeEl = document.getElementById('cube');
const cubeR = new THREE.WebGLRenderer({ canvas: cubeEl, antialias: true, alpha: true });
cubeR.setPixelRatio(Math.min(devicePixelRatio, 2));
const cubeScene = new THREE.Scene(), cubeCam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
const faceTex = (txt) => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#2a3140'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#4a5468'; g.lineWidth = 6; g.strokeRect(3, 3, 250, 250);
  g.fillStyle = '#dfe6f3'; g.font = `600 ${txt.length > 5 ? 44 : 50}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(txt, 128, 132);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
};
// BoxGeometry face order: +x, -x, +y, -y, +z, -z (muzzle, butt, top, bottom, right, left)
const cubeBox = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2),
  ['FRONT', 'BACK', 'TOP', 'BOTTOM', 'RIGHT', 'LEFT'].map(t => new THREE.MeshBasicMaterial({ map: faceTex(t) })));
const cubeHi = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0x4d8dff, transparent: true, opacity: 0.55, depthTest: false }));
cubeHi.visible = false; cubeHi.renderOrder = 1;
cubeScene.add(cubeBox, cubeHi);
const cubeRay = new THREE.Raycaster(), cubeNdc = new THREE.Vector2();
// zone under the pointer as a direction with components -1, 0 or 1, or null off the cube
const cubeZone = e => {
  const r = cubeEl.getBoundingClientRect();
  cubeNdc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  cubeRay.setFromCamera(cubeNdc, cubeCam);
  const h = cubeRay.intersectObject(cubeBox)[0];
  if (!h) return null;
  return new THREE.Vector3(...h.point.toArray().map(v => Math.abs(v) > 0.6 ? Math.sign(v) : 0));
};
const showZone = z => {
  cubeHi.visible = !!z;
  if (!z) return;
  const c = z.toArray().map(v => v ? v * 0.8 : 0), sz = z.toArray().map(v => v ? 0.42 : 1.2);
  cubeHi.position.set(...c); cubeHi.scale.set(...sz);
};
let cubeDrag = null;
cubeEl.addEventListener('pointerdown', e => { cubeDrag = { x: e.clientX, y: e.clientY, moved: false }; cubeEl.setPointerCapture(e.pointerId); });
cubeEl.addEventListener('pointermove', e => {
  if (!cubeDrag) { showZone(cubeZone(e)); return; }
  const dx = e.clientX - cubeDrag.x, dy = e.clientY - cubeDrag.y;
  if (!cubeDrag.moved && Math.hypot(dx, dy) < 4) return;
  cubeDrag.moved = true; cubeEl.classList.add('drag'); showZone(null); camTween = null;
  const off = camera.position.clone().sub(controls.target), sph = new THREE.Spherical().setFromVector3(off);
  sph.theta -= dx * 0.012; sph.phi = THREE.MathUtils.clamp(sph.phi - dy * 0.012, 0.01, Math.PI - 0.01);
  camera.position.copy(controls.target).add(off.setFromSpherical(sph));
  cubeDrag.x = e.clientX; cubeDrag.y = e.clientY;
});
cubeEl.addEventListener('pointerup', e => {
  if (cubeDrag && !cubeDrag.moved) {
    const z = cubeZone(e);
    if (z) { if (!z.x && !z.z) z.z = 1e-3; viewDir(z); }   // straight up or down: lean a hair to the right so the muzzle points right
  }
  cubeDrag = null; cubeEl.classList.remove('drag');
});
cubeEl.addEventListener('pointerleave', () => { if (!cubeDrag) showZone(null); });
const cubeSize = () => { const r = cubeEl.getBoundingClientRect(); cubeR.setSize(r.width, r.height, false); };
cubeSize(); addEventListener('resize', cubeSize); MOBILE.addEventListener('change', cubeSize);
const orthoCb = document.getElementById('ortho');
orthoCb.onchange = () => { useOrtho = orthoCb.checked; };

// ---------- keys ----------
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && document.activeElement.type !== 'checkbox' && document.activeElement.type !== 'range') return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (isolated) isolate(null); else if (selected) select(null); }
  else if (k === '/') { e.preventDefault(); showPanel('side', true); find.focus(); find.select(); }
  else if (k === 'f') { if (selected) focusOn(selected); else camTween = { pos: HOME_POS.clone(), tgt: HOME_TGT.clone() }; }
  else if (k === 'h') toggleAll();
  else if (k === 'p') showPanel('side', !isOpen('side'));
  else if (k === 'v') showPanel('ctrl', !isOpen('ctrl'));
  else if (k === 'i') showPanel('info', !isOpen('info'));
  else if (VIEW_KEYS[k]) viewFrom(VIEW_KEYS[k]);
  else if (k === 'o') { orthoCb.checked = !orthoCb.checked; orthoCb.onchange(); }
});
MOBILE.addEventListener('change', initPanels);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

// ---------- loop ----------
const exv = document.getElementById('exv');
const slideCtl = document.getElementById('slidepos'), spv = document.getElementById('spv');
const SLIDE_TRAVEL = 27;   // mm the slide runs back to lock open (approximate)
const SLIDE = { pos: 0 };
const showSlide = () => { SLIDE.pos = +slideCtl.value; spv.textContent = SLIDE.pos ? `${Math.round(SLIDE.pos * SLIDE_TRAVEL)} mm back` : 'closed'; };
slideCtl.oninput = showSlide; showSlide();
let slideOff = 0;
renderer.setAnimationLoop(() => {
  exCur += (exTarget - exCur) * 0.12;
  if (Math.abs(exTarget - exCur) < 1e-4) exCur = exTarget;
  exv.textContent = Math.round(exCur * 100) + '%';
  slideOff += (SLIDE.pos * SLIDE_TRAVEL - slideOff) * 0.15;
  const e = exCur * exCur * (3 - 2 * exCur);
  for (const p of parts) {
    p.position.copy(p.userData.explode).multiplyScalar(e);
    if (p.userData.slide) p.position.x -= Math.min(slideOff, p.userData.slide);
    p.userData.label.visible = p.visible && (p === selected || (labelsCb.checked && exCur > 0.25));
  }
  if (camTween) {   // ease azimuth, elevation and distance together, so the camera swings round the target (never
    // through it) and the turn about the vertical happens along the way, not as a slow spin at the end near the poles
    const s0 = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const s1 = new THREE.Spherical().setFromVector3(camTween.pos.clone().sub(camTween.tgt));
    const dth = Math.atan2(Math.sin(s1.theta - s0.theta), Math.cos(s1.theta - s0.theta));
    s0.theta += dth * 0.25; s0.phi += (s1.phi - s0.phi) * 0.1; s0.radius += (s1.radius - s0.radius) * 0.1;   // turn settles first
    controls.target.lerp(camTween.tgt, 0.1);
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s0));
    if (camera.position.distanceTo(camTween.pos) < 2 && controls.target.distanceTo(camTween.tgt) < 1) camTween = null;
  }
  controls.update();
  if (useOrtho) {
    const h = camera.position.distanceTo(controls.target) * Math.tan(camera.fov * Math.PI / 360);
    Object.assign(ortho, { left: -h * camera.aspect, right: h * camera.aspect, top: h, bottom: -h });
    ortho.position.copy(camera.position); ortho.quaternion.copy(camera.quaternion); ortho.updateProjectionMatrix();
  }
  renderer.render(scene, viewCam());
  labelRenderer.render(scene, viewCam());
  cubeCam.position.copy(camera.position).sub(controls.target).setLength(6.6); cubeCam.quaternion.copy(camera.quaternion);
  cubeR.render(cubeScene, cubeCam);
});

const EX_TGT = new THREE.Vector3(-5, -60, 0), EX_POS = fit(new THREE.Vector3(-160, 10, -800), EX_TGT);
const fromHash = () => { if (location.hash.includes('exploded')) { exTarget = 1; exSlider.value = 1; labelsCb.checked = true; camTween = { pos: EX_POS.clone(), tgt: EX_TGT.clone() }; } };
fromHash(); addEventListener('hashchange', fromHash);
window.__g19 = { parts, select, showList, THREE, scene, renderer, camera, controls, floor, grid, labelRenderer, root, SLIDE };
</script>
</body>
</html>
