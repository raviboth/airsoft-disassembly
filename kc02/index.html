// ---------- geometry helpers (x = along gun, muzzle +; y = up; z = right side) ----------
function prof(pts, depth, bevel = 1.2, holes = []) {
  const s = new THREE.Shape();
  pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));
  for (const h of holes) {
    const p = new THREE.Path();
    h.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y));
    s.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 });

// lathe around the x axis: pts = [[radius, x], ...]
function latheX(pts, seg = 36, y = 0, z = 0, phiStart = 0) {
  // one lathe strip per profile segment, merged: keeps corners crisp instead of smoothing normals across them
  const strips = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [r0, x0] = pts[i], [r1, x1] = pts[i + 1];
    if (r0 === r1 && x0 === x1) continue;
    strips.push(new THREE.LatheGeometry([new THREE.Vector2(r0, x0), new THREE.Vector2(r1, x1)], seg, phiStart));
  }
  const g = strips.length === 1 ? strips[0] : mergeGeometries(strips);
  g.rotateZ(-Math.PI / 2);
  g.translate(0, y, z);
  return g;
}

  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);

}

  if (axis === 'z') g.rotateX(Math.PI / 2);

    return v.set(t * this.len, this.r * Math.cos(a), this.r * Math.sin(a));

// loft through horizontal sections: levels = [{ y, xf, xb, w }] (front x, back x, width), top to bottom.
// Levels are resampled with Catmull-Rom so the sides stay smooth; sections are rounded rectangles

function loftResample(levels, step) {

  const L = [];

    const steps = Math.max(1, Math.round(Math.abs(b.y - c.y) / step));

  return L;
}

  const cx = (lv.xf + lv.xb) / 2, ax = (lv.xf - lv.xb) / 2, c = Math.cos(t), sn = Math.sin(t);
  const px = Math.sign(c) * Math.pow(Math.abs(c), 2 / n), pz = Math.sign(sn) * Math.pow(Math.abs(sn), 2 / n);

}
// curved patch lying on a loft surface: t0..t1 around the section, y0..y1 down the body, lifted `lift` mm along z
function loftPatch(levels, { t0, t1, y0, y1, lift = 0.5, n = 2.8, frontTaper = 0.7, step = 1.5, cols = 16, uvScale = 0.12 }) {
  const L = loftResample(levels, step).filter(lv => lv.y <= y0 && lv.y >= y1);
  const pos = [], uv = [], idx = [];
  L.forEach(lv => { for (let i = 0; i <= cols; i++) {
    const t = t0 + (t1 - t0) * i / cols, [x, y, z] = loftPoint(lv, t, n, frontTaper);
    pos.push(x, y, z + Math.sign(z) * lift); uv.push(x * uvScale, y * uvScale);
  } });
  for (let k = 0; k < L.length - 1; k++) for (let i = 0; i < cols; i++) {
    const a = k * (cols + 1) + i, b = a + 1, c = a + cols + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function loft(levels, { n = 2.8, seg = 40, step = 1.5, frontTaper = 0.7 } = {}) {
  const L = loftResample(levels, step);
  const pos = [], idx = [];
  const ring = (lv) => { const out = []; for (let i = 0; i < seg; i++) out.push(loftPoint(lv, (i / seg) * Math.PI * 2, n, frontTaper)); return out; };
  L.forEach(lv => ring(lv).forEach(v => pos.push(...v)));
  for (let k = 0; k < L.length - 1; k++) for (let i = 0; i < seg; i++) {
    const a = k * seg + i, b = k * seg + (i + 1) % seg, c = a + seg, d = b + seg;
    idx.push(a, b, c, b, d, c);
  }
  for (const [lv, flip] of [[L[0], false], [L[L.length - 1], true]]) {
    const base = pos.length / 3;
    ring(lv).forEach(v => pos.push(...v));
    pos.push((lv.xf + lv.xb) / 2, lv.y, 0);
    for (let i = 0; i < seg; i++) { const a = base + i, b = base + (i + 1) % seg; flip ? idx.push(base + seg, a, b) : idx.push(base + seg, b, a); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
// diamond checkering bump texture (canvas), for grip panels
const CHECKER = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 64, 64); x.strokeStyle = '#000'; x.lineWidth = 6;
  for (let k = -64; k <= 128; k += 32) { x.beginPath(); x.moveTo(k, 0); x.lineTo(k + 64, 64); x.stroke(); x.beginPath(); x.moveTo(k, 64); x.lineTo(k + 64, 0); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.3, 0.3);
  return t;
})();
// picatinny-ish rail: base + cross teeth. face: 'up' | 'down' | 'right' | 'left'; yc shifts side rails vertically
function railFace(face, off, halfW, a0, a1, t0, t1, yc = 0) {
  if (face === 'up')    return bx(a0, a1, off + t0, off + t1, -halfW, halfW);
  if (face === 'down')  return bx(a0, a1, -off - t1, -off - t0, -halfW, halfW);
  if (face === 'right') return bx(a0, a1, yc - halfW, yc + halfW, off + t0, off + t1);
  return bx(a0, a1, yc - halfW, yc + halfW, -off - t1, -off - t0);
}
function rail(x0, x1, face, off, { halfW = 10.5, base = 6, tooth = 4, yc = 0 } = {}) {
  const out = [railFace(face, off, halfW, x0, x1, 0, base, yc)];
  for (let x = x0 + 3; x + 5.2 <= x1; x += 10) out.push(railFace(face, off, halfW - 0.5, x, x + 5.2, base, base + tooth, yc));
  return out;
}
// ribbed rail guard covering a side rail
function guard(x0, x1, face, off, { halfW = 19, yc = 0, t0 = 6 } = {}) {
  const out = [railFace(face, off, halfW, x0, x1, t0, t0 + 1.5, yc)];
  for (let x = x0 + 4; x + 6 <= x1; x += 10.8) out.push(railFace(face, off, halfW - 2, x, x + 6, t0 + 1.5, t0 + 3.5, yc));
  return out;
}
// slanted slot row on both sides of a body at |z| = zs
function slots(xs, y0, y1, zs, w = 3.4, lean = -0.3) {
  const out = [];
  for (const x of xs) for (const s of [1, -1]) {
    const g = new THREE.BoxGeometry(w, y1 - y0, 0.8); g.rotateZ(lean); g.translate(x, (y0 + y1) / 2, s * zs);
    out.push([g, 'black']);
  }
  return out;
}

const CATS = {
  ext: 'Furniture and stock',
  sgt: 'Rails and sights',
  rcv: 'Receiver and bolt',
  bar: 'Barrel and hop-up',
  trg: 'Trigger group',
  mag: 'Magazine',
  acc: 'Loading tools',
};
const parts = [];
const meshes = [];
const root = new THREE.Group();
scene.add(root);
const byNo = new Map();

function part(id, name, cat, nos, explode, info, pieces, opts = {}) {
  const grp = new THREE.Group();
  grp.userData = { id, name, cat, nos, info, explode: new THREE.Vector3(...explode), shell: !!opts.shell, slide: !!opts.slide };
  for (const [geo, matKey] of pieces) {
    if (opts.dx) geo.translate(opts.dx, 0, 0);
    const mat = new THREE.MeshStandardMaterial({ ...MAT[matKey] });
    if (matKey === 'checker') { mat.bumpMap = CHECKER; mat.bumpScale = 2.5; }
    if (geo.type === 'LatheGeometry') mat.side = THREE.DoubleSide;
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = true; m.receiveShadow = true;
    m.userData.part = grp; m.userData.baseEmissive = mat.emissive.getHex();
    grp.add(m); meshes.push(m);
  }
  const c = new THREE.Box3().setFromObject(grp).getCenter(new THREE.Vector3());
  const el = document.createElement('div'); el.className = 'lbl';
  el.textContent = (nos.length ? '#' + nos[0] + ' ' : '') + name;
  const lbl = new CSS2DObject(el); lbl.position.copy(c); lbl.visible = false;
  grp.add(lbl);
  grp.userData.label = lbl;
  root.add(grp); parts.push(grp);
  for (const n of nos) byNo.set(n, grp);
  return grp;
}

// ---------- UI: list ----------
const list = document.getElementById('list');
const byCat = {};
for (const p of parts) (byCat[p.userData.cat] ||= []).push(p);
const itemEls = new Map();
const catOn = {};
const catEls = {};
let isolated = null;
function updateVis() {
  for (const p of parts) p.visible = isolated ? p === isolated : catOn[p.userData.cat];
}
// UI state that survives a reload: open panels (desktop only) and folded categories.
const MOBILE = matchMedia('(max-width:700px)');
const store = (() => { try { return JSON.parse(localStorage.getItem('adis-kc02-ui')) || {}; } catch { return {}; } })();
const save = () => { try { localStorage.setItem('adis-kc02-ui', JSON.stringify(store)); } catch {} };
store.folded ||= {};
function setFold(key, folded) {
  store.folded[key] = folded; save();
  catEls[key].car.textContent = folded ? '▸' : '▾';
  applyFilter();
}
for (const [key, label] of Object.entries(CATS)) {
  catOn[key] = true;
  const head = document.createElement('div'); head.className = 'cat';
  const car = document.createElement('span'); car.className = 'car';
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; cb.title = 'Show or hide this category';
  cb.onclick = e => e.stopPropagation();
  cb.onchange = () => { catOn[key] = cb.checked; updateVis(); };
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = label + ` (${byCat[key].length})`;
  head.append(car, cb, nm);
  head.onclick = () => setFold(key, !store.folded[key]);
  list.append(head); catEls[key] = { head, car };
  car.textContent = store.folded[key] ? '▸' : '▾';
  for (const p of byCat[key]) {
    const it = document.createElement('div'); it.className = 'item';
    it.innerHTML = `<span>${p.userData.name}</span><span class="pn">#${p.userData.nos[0]}</span>`;
    it.onclick = () => { select(p, true); if (MOBILE.matches) showPanel('side', false); };
    it.onmouseenter = () => hover(p);
    it.onmouseleave = () => hover(null);
    list.append(it); itemEls.set(p, it);
  }
}
// Search: matches the name or any manual part number. "112" and "#112" both work.
const find = document.getElementById('find');
const nohit = document.getElementById('nohit');
const hay = p => { const d = p.userData; return [d.name, ...d.nos.map(n => '#' + n)].join(' ').toLowerCase(); };
function matches(p, q) {
  if (!q) return true;
  const d = p.userData, n = q.replace(/^#/, '');
  if (d.nos.some(x => x.toLowerCase() === n)) return true;
  return q.split(/\s+/).every(w => hay(p).includes(w));
}
function applyFilter() {
  const q = find.value.trim().toLowerCase();
  let any = false;
  for (const [key] of Object.entries(CATS)) {
    let n = 0;
    for (const p of byCat[key]) {
      const m = matches(p, q); n += m;
      itemEls.get(p).classList.toggle('hid', !m || (!q && !!store.folded[key]));
    }
    catEls[key].head.classList.toggle('hid', !!q && !n);
    any ||= n > 0;
  }
  nohit.style.display = any ? 'none' : 'block';
}
find.oninput = applyFilter;
find.onkeydown = e => {
  if (e.key === 'Escape') { find.value = ''; applyFilter(); find.blur(); e.stopPropagation(); }
  if (e.key === 'Enter') { const p = parts.find(p => !itemEls.get(p).classList.contains('hid')); if (p) select(p, true); }
};
applyFilter();

// ---------- explode ----------
const exSlider = document.getElementById('explode');
let exTarget = 0, exCur = 0;
exSlider.oninput = () => exTarget = +exSlider.value;
document.getElementById('bAsm').onclick = () => { exTarget = 0; exSlider.value = 0; };
document.getElementById('bExp').onclick = () => { exTarget = 1; exSlider.value = 1; };
let camTween = null;
document.getElementById('bReset').onclick = () => { camTween = { pos: HOME_POS.clone(), tgt: HOME_TGT.clone() }; };
const spin = document.getElementById('spin');
spin.onchange = () => controls.autoRotate = spin.checked;

document.getElementById('xray').onchange = e => {
  for (const p of parts) if (p.userData.shell) p.traverse(o => {
    if (!o.isMesh) return;
    o.material.transparent = e.target.checked;
    o.material.opacity = e.target.checked ? 0.09 : 1;
    o.material.depthWrite = !e.target.checked;
  });
};
const labelsCb = document.getElementById('labels');

// ---------- panels ----------
const info = document.getElementById('info');
const infoBody = document.getElementById('infoBody');
const PANELS = { side: 'tSide', ctrl: 'tCtrl', info: 'tInfo' };
const panelEl = id => document.getElementById(id);
const isOpen = id => !panelEl(id).classList.contains('hidden');
function showPanel(id, on) {
  panelEl(id).classList.toggle('hidden', !on);
  document.getElementById(PANELS[id]).classList.toggle('on', on);
  // On a phone the parts drawer and the view menu share the same space: one at a time.
  if (on && MOBILE.matches && id !== 'info') showPanel(id === 'side' ? 'ctrl' : 'side', false);
  if (on && MOBILE.matches && id !== 'info') info.classList.add('peek');
  if (!MOBILE.matches) { store.open ||= {}; store.open[id] = on; save(); }
  document.getElementById('tAll').textContent = Object.keys(PANELS).some(isOpen) ? 'Hide all' : 'Show all';
}
for (const id in PANELS) document.getElementById(PANELS[id]).onclick = () => showPanel(id, !isOpen(id));
document.querySelectorAll('.x').forEach(b => b.onclick = () => showPanel(b.dataset.p, false));
function toggleAll() {
  const on = !Object.keys(PANELS).some(isOpen);
  for (const id in PANELS) if (!(on && MOBILE.matches && id === 'ctrl')) showPanel(id, on);
}
document.getElementById('tAll').onclick = toggleAll;
function initPanels() {
  for (const id in PANELS) showPanel(id, MOBILE.matches ? id === 'info' : store.open?.[id] ?? true);
  info.classList.toggle('peek', MOBILE.matches);
}
document.querySelector('.grab').onclick = () => info.classList.toggle('peek');
info.addEventListener('click', e => { if (info.classList.contains('peek') && !e.target.closest('button, a, .grab')) info.classList.remove('peek'); });

// ---------- info panel ----------
const SOURCES = `<p class="src">Sources: <a href="https://www.kjworks.com.tw/photo/13432700223.pdf">KJW KC-02 V2 manual (PDF)</a>, <a href="https://www.kjworks.com.tw/photo/12919005273.pdf">V1 manual (PDF)</a>, <a href="https://www.rogueworx.com/">Rogueworx product pages</a>, <a href="https://www.popularairsoft.com/news/ra-tech-m1-carbine-conversion-kit">RA Tech M1 kit</a>,
<a href="https://www.booliganairsoft.com/2012/12/kjw-kc02-1022-gbbr.html">Booligan review</a>,
<a href="https://www.replicaairguns.com/posts/2016/4/9/kjwork-kc-02-version-2-1022-gas-blowback-airsoft-carbine.html">ReplicaAirguns V2</a>,
<a href="https://www.redwolfairsoft.com/gas-pistols-smgs-kj-works-kc-02-version-2-with-long-magazine.html">RedWolf</a>,
<a href="https://www.evike.com/search/?keywords=KC02">Evike part listings</a>. Shapes and positions are approximate, traced from the manual drawing, not measured.</p>`;
function showOverview() {
  infoBody.innerHTML = `<h2>KJW KC-02 V2 (KJ Works 10/22 tactical carbine)</h2>
  <div class="meta">Gas blowback, semi-auto only. Green gas or CO2 (per mag).</div>
  <p>Length 780 to 865mm (stock in/out). Weight 2.65 to 2.79kg. Nylon fiber, aluminum and zinc. 380 to 440 fps on 0.20g depending on gas. Mag 22 (V1 short) or 29 to 30 (V2 long).</p>
  <ul>
    <li>Manual limit: don't use gas above 12 kg/cm².</li>
    <li>Fill the mag vertical for about 5 seconds. Bolt locks back on empty.</li>
    <li>Front sight dial sets elevation, rear sight screw sets windage, rail 2 dial sets hop.</li>
    <li>V1 vs V2 (both KJW manuals): same receiver, bolt, barrel, trigger group and stock. V1 had different sights (fixed front base #15, rear sight with windage/elevation knobs #75 to #94) and a two-piece 22-round mag (#123/#128). V2 has the flip-up sights and the long mag, plus a CO2 option.</li>
    <li>Scale: traced from the manual render, then scaled so the barrel is 0.920 in and the gun measures 780/865mm collapsed/extended; both anchors agree within 1%. The render itself shows the stock at position 3.</li>
    <li>Generic vs specific: the rear stock, tube and grip are generic M4 parts. The front stock, receiver and internals are KC-02 specific. The barrel copies the real 10/22 .920 in bull profile.</li>
  </ul>
  <p>${parts.length} modeled assemblies covering ${byNo.size} of ${MANUAL.length} manual part numbers. Drag to orbit, scroll to zoom, right-drag to pan. Double-click a part to zoom to it.</p>
  <p class="src">Keys: / search, F zoom to the selected part, Esc show all or deselect, H hide or show panels, P parts, V view, I info.</p>${SOURCES}`;
}
function showList(hitNos = []) {
  const rows = MANUAL.map(([no, name, price]) => {
    const mod = byNo.has(no);
    return `<tr class="${mod ? 'mod' : ''} ${hitNos.includes(no) ? 'hit' : ''}" data-no="${no}"><td>#${no}</td><td>${name}</td><td>${price}</td></tr>`;
  }).join('');
  infoBody.innerHTML = `<h2>Manual parts list (${MANUAL.length})</h2><div class="meta">Names and list prices as printed in the V2 manual (currency not stated). Blue rows are modeled, click to find them.</div><table>${rows}</table>`;
  infoBody.querySelectorAll('tr.mod').forEach(tr => tr.onclick = () => select(byNo.get(tr.dataset.no), true));
}
document.getElementById('bList').onclick = () => showList(selected ? selected.userData.nos : []);
document.getElementById('bInfo').onclick = () => select(null);

// ---------- selection ----------
let selected = null;
function setGlow(p, on, col = 0x2f6bff) {
  p.traverse(o => { if (o.isMesh) {
    o.material.emissive.setHex(on ? col : o.userData.baseEmissive);
    o.material.emissiveIntensity = on ? 0.55 : 1;
  } });
}
// Hover glow, shared by the canvas and the parts list.
let hovered = null;
function hover(p) {
  if (hovered && hovered !== selected) setGlow(hovered, false);
  hovered = p;
  if (p && p !== selected) setGlow(p, true, 0x3a3f4a);
}
// Frame a part: aim at its bounding box centre and back off until the box fits the narrower field of view.
function focusOn(p) {
  const box = new THREE.Box3().setFromObject(p);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const half = Math.min(camera.fov / 2 * Math.PI / 180, Math.atan(Math.tan(camera.fov / 2 * Math.PI / 180) * camera.aspect));
  const dist = THREE.MathUtils.clamp(r / Math.sin(half) * 1.15, 60, 3500);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camTween = { tgt: c, pos: c.clone().add(dir.multiplyScalar(dist)) };
}
function isolate(p) {
  isolated = p; updateVis();
  const b = infoBody.querySelector('#bIso');
  if (b) { b.classList.toggle('on', !!p); b.textContent = p ? 'Show all (Esc)' : 'Show only this'; }
}
function select(p, focus = false) {
  if (selected) { setGlow(selected, false); itemEls.get(selected).classList.remove('sel'); selected.userData.label.element.classList.remove('sel'); }
  selected = p;
  if (!p) { if (isolated) isolate(null); showOverview(); return; }
  if (isolated) isolate(p);
  setGlow(p, true);
  const it = itemEls.get(p);
  if (it.classList.contains('hid')) {
    if (find.value) { find.value = ''; }
    store.folded[p.userData.cat] = false; save();
    catEls[p.userData.cat].car.textContent = '▾';
    applyFilter();
  }
  it.classList.add('sel');
  it.scrollIntoView({ block: 'nearest' });
  p.userData.label.element.classList.add('sel');
  const d = p.userData;
  const rows = d.nos.map(n => MANUAL.find(r => r[0] === n)).filter(Boolean)
    .map(([no, name, price]) => `<tr><td>#${no}</td><td>${name}</td><td>${price}</td></tr>`).join('');
  infoBody.innerHTML = `<h2>${d.name}</h2><div class="meta">${CATS[d.cat]}</div>
    <div class="acts"><button id="bZoom" title="F">Zoom to</button><button id="bIso" class="${isolated ? 'on' : ''}">${isolated ? 'Show all (Esc)' : 'Show only this'}</button></div><p>${d.info}</p>
    <table>${rows}</table><p class="src">Names and list prices as printed in the V2 manual.</p>${SOURCES}`;
  infoBody.querySelector('#bZoom').onclick = () => focusOn(p);
  infoBody.querySelector('#bIso').onclick = () => { isolate(isolated ? null : p); if (isolated) focusOn(p); };
  infoBody.scrollTop = 0;
  if (focus) focusOn(p);
}
showOverview();
initPanels();

// ---------- picking ----------
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
const tip = document.getElementById('tip');
let downAt = null;
function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(meshes.filter(m => m.parent.visible), false)
    .find(h => !(h.object.material.transparent && h.object.material.opacity < 0.5));
  return hit ? hit.object.userData.part : null;
}
renderer.domElement.addEventListener('pointermove', e => {
  const p = pick(e);
  hover(p);
  tip.style.display = p ? 'block' : 'none';
  if (p) { tip.textContent = `#${p.userData.nos[0]} ${p.userData.name}`; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 10 + 'px'; }
  renderer.domElement.style.cursor = p ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  select(pick(e));
});
renderer.domElement.addEventListener('dblclick', e => { const p = pick(e); if (p) select(p, true); });

// ---------- keys ----------
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && document.activeElement.type !== 'checkbox' && document.activeElement.type !== 'range') return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (isolated) isolate(null); else if (selected) select(null); }
  else if (k === '/') { e.preventDefault(); showPanel('side', true); find.focus(); find.select(); }
  else if (k === 'f') { if (selected) focusOn(selected); else camTween = { pos: HOME_POS.clone(), tgt: HOME_TGT.clone() }; }
  else if (k === 'h') toggleAll();
  else if (k === 'p') showPanel('side', !isOpen('side'));
  else if (k === 'v') showPanel('ctrl', !isOpen('ctrl'));
  else if (k === 'i') showPanel('info', !isOpen('info'));
});
MOBILE.addEventListener('change', initPanels);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

// ---------- loop ----------
const exv = document.getElementById('exv');
const stockCtl = document.getElementById('stockpos'), spv = document.getElementById('spv');
const STOCK = { pos: 1, cur: (RENDER_POS - 1) * STOCK_STEP };
const showLen = () => { const p = +stockCtl.value; STOCK.pos = p; spv.textContent = `${p} (${Math.round((778 - (RENDER_POS - p) * STOCK_STEP) * S)} mm overall)`; };
stockCtl.oninput = showLen; showLen();
let stockOff = STOCK.cur;
renderer.setAnimationLoop(() => {
  exCur += (exTarget - exCur) * 0.12;
  if (Math.abs(exTarget - exCur) < 1e-4) exCur = exTarget;
  exv.textContent = Math.round(exCur * 100) + '%';
  stockOff += ((RENDER_POS - STOCK.pos) * STOCK_STEP - stockOff) * 0.15;
  const e = exCur * exCur * (3 - 2 * exCur);
  for (const p of parts) {
    p.position.copy(p.userData.explode).multiplyScalar(e);
    if (p.userData.slide) p.position.x += stockOff;
    p.userData.label.visible = p.visible && (p === selected || (labelsCb.checked && exCur > 0.25));
  }
  if (camTween) {
    controls.target.lerp(camTween.tgt, 0.1); camera.position.lerp(camTween.pos, 0.1);
    if (camera.position.distanceTo(camTween.pos) < 2) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

const fromHash = () => { if (location.hash.includes('exploded')) { exTarget = 1; exSlider.value = 1; labelsCb.checked = true; } };
fromHash(); addEventListener('hashchange', fromHash);
window.__kc02 = { parts, select, showList, THREE, scene, renderer, camera, floor, grid, labelRenderer, root, STOCK, STOCK_STEP, RENDER_POS };
</script>
</body>
</html>
